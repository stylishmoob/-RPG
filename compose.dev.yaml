services:
  frontend:
    image: node:22
    container_name: rpg-frontend-dev
    working_dir: /app
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_PROXY_TARGET: http://flask:8000
    depends_on:
      - flask

  flask:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-rpg-dev
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:password@db:5432/rpg
      SECRET_KEY: development-secret-key
    volumes:
      - ./backend:/app/backend
    command: flask --app backend.app run --host=0.0.0.0 --port=8000 --debug
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    container_name: postgres-rpg-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: rpg
    ports:
      - "5432:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rpg"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_dev_data:
  frontend_node_modules:
